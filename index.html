<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Steam Autumn Sale Hero</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
        <header>
        <nav>
          <section class="top-nav">
            <div class="steam-logo">
              <ul>
                <li>
                  <a href="index.html"
                    ><img src="images/steam-logo.png" class="logo" alt="Steam" />
                  </a>
                </li>
              </ul>
            </div>
            <div class="top-left-nav">
              <ul>
                  <li><a href="index.html"><h6>View</h6></a></li>
                  <li><a href="index.html"><h6>Friends</h6></a></li>
                  <li><a href="index.html"><h6>Games</h6></a></li>
                  <li><a href="index.html"><h6>Help</h6></a></li>
              </ul>
            </div>
          </section>
          <section class="bottom-nav">
            <div class="arrow-nav-btns">
              <ul>
                <li>
                 <a href="index.html"
                   ><img src="images/back-arrow.png" class="back-arrow" />
                  </a>
                 <a href="index.html"
                   ><img src="images/forward-arrow.png" class="forward-arrow" />
                  </a>
                </li>
              </ul>
            </div>
            <div class="main-menu-nav">
              <ul>
                <li class="active"><a href="index.html"><h5>STORE</h5></a></li>
                <li><a href="index.html"><h5>LIBRARY</h5></a></li>
                <li><a href="index.html"><h5>COMMUNITY</h5></a></li>
                <li><a href="index.html"><h5>JANEDOE</h5></a></li>
              </ul>
            </div>
            <div class="right-btns">
            <ul>
              <li>
                <button class="btn-steam-news"
                  ><img src="images/steam-news.png"
                        alt="View News from Steam"
                        title="View News from Steam"
                        class="steam-news-btn" />
              </button>
              </li>
              <li>
                <button class="btn-notification" data-modal-target="#modal">
                  <img src="images/steam-notifications.png"
                      alt="View Notifications"
                      title="View Notifications"/></button>
                <div class="modal" id="modal">
                  <div class="modal-header">
                    <div class="title">
                      <h4>Check It Out</h4>
                      <h2>Some Items From Your Wishlist Are On Sale!</h2>
                    </div>
                    <button data-close-button class="close-button">&times;</button>
                  </div>
                  <div class="modal-body">
                    <ul>
                      <li>
                        <a href="index.html">
                        <img
                          src="images/dragon-age-inquistion.jpg"
                          alt="Dragon Age: Inquisition"
                          title="Dragon Age: Inquisition"
                          class="wishlist-img"
                          />
                          </a>
                      </li>
                      <li>
                        <a href="index.html">
                        <img
                          src="images/rpg-maker-mz.jpg"
                          alt="RPG Maker MZ"
                          title="RPG Maker MZ"
                          class="wishlist-img"
                          />
                          </a>
                      </li>
                      <li>
                        <a href="index.html">
                        <img
                          src="images/deltarune.jpg"
                          alt="Deltarune"
                          title="Deltarune"
                          class="wishlist-img"
                          />
                          </a>
                      </li>
                    </ul>
                  </div>
                  <div class="modal-footer">
                    <a href="index.html" class="btn-default">Shop Sale</a>
                  </div>
                </div>
                  <div id="overlay"></div>
              </li>
            </ul>
            </div>
          </section>
        </nav>
      </header>
      <main>
        <section class="hero">
          <div class="hero-container">
            <div class="hero-left">
          <h2>
            Steam
          </h2>
          <h1>Autumn Sale</h1>
          <h3>
            Nov. 27-Dec. 4 at 10am Pacific
          </h3>
            </div>
            <div class="hero-right">
              <a href="index.html" class="btn-default">Shop Sale</a>
            </div>
          </div>
            <div class="featured-games">
              <ul>
                <li>
                  <a href="index.html">
                  <img
                    src="images/assassins-creed.jpg"
                    alt="Assassins Creed: Valhalla"
                    title="Assassins Creed: Valhalla"
                    class="hero-img"
                  />
                  </a>
                  </li>
                  <li>
                    <a href="index.html">
                    <img
                      src="images/hollow-knight.jpg"
                      alt="Hollow Knight"
                      title="Hollow Knight"
                      class="hero-img"
                    />
                    </a>
                    </li>
                    <li>
                      <a href="index.html">
                      <img
                        src="images/baldurs-gate.jpg"
                        alt="Baldurs Gate 3"
                        title="Baldurs Gate 3"
                        class="hero-img"
                      />
                      </a>
                      </li>
                      <li>
                        <a href="index.html">
                        <img
                          src="images/spyro.jpg"
                          alt="Spyro: Reignited Trilogy"
                          title="Spyro: Reignited Trilogy"
                          class="hero-img"
                        />
                        </a>
                        </li>
                      <li>
                        <a href="index.html">
                        <img
                          src="images/dragon-quest.jpg"
                          alt="Dragon Quest III"
                          title="Dragon Quest III"
                          class="hero-img"
                        />
                        </a>
                        </li>
              </ul>
            </div>
        </section>
        </main>
  </body>
</html>
